# ===================================================================
# PERFIL DE PRODUCCION / AVANCE 2 (PostgreSQL en pgAdmin 4)
# Para activar PostgreSQL: fijar spring.profiles.active=prod
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/cobranza_vecinal_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs
logging.file.name=./logs/cobranza-prod.log
logging.level.com.condominio=INFO
