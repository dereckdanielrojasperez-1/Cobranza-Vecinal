# ===================================================================
# PERFIL DE BASE DE DATOS EXTERNA (PostgreSQL / MySQL / Servidor Remoto)
# Para activar: pasar parametro --spring.profiles.active=external
# o definir variable de entorno SPRING_PROFILES_ACTIVE=external
# ===================================================================

# Parametros de Conexion JDBC
# Se pueden sobreescribir con variables de entorno del sistema o contenedor:
# DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, DB_DIALECT
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cobranza_vecinal_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ===================================================================
# EJEMPLO DE CONFIGURACION PARA MYSQL (Alternativa):
# Descomentar las siguientes 3 lineas si se utiliza MySQL:
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cobranza_vecinal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ===================================================================

# Dialecto y Comportamiento de Hibernate JPA
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pool de Conexiones HikariCP Optimizado para Produccion y Concurrencia
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariCP-ExternalDB-Pool

# Optimizacion de arranque
spring.main.banner-mode=off
spring.main.lazy-initialization=true

# Logs
logging.file.name=./logs/cobranza-external.log
logging.level.com.condominio=INFO
