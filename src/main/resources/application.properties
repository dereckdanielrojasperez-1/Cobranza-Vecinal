# ===================================================================
# CONFIGURACION PRINCIPAL DE COBRANZA VECINAL
# ===================================================================
spring.application.name=cobranza-vecinal
spring.profiles.active=dev
spring.main.banner-mode=off

# ===================================================================
# OPTIMIZACION DE ARRANQUE RAPIDO (FAST STARTUP)
# ===================================================================
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACION DE LOGS PROFESIONALES (SLF4J / Logback)
# ===================================================================
logging.file.name=./logs/cobranza.log
logging.level.com.condominio=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
