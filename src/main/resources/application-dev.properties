# ===================================================================
# PERFIL DE DESARROLLO (H2 Database en archivo persistente con AUTO_SERVER)
# Inicializacion de los 5 esquemas relacionales para evitar error 'Schema not found'
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/cobranzadb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS financiero\\;CREATE SCHEMA IF NOT EXISTS inmuebles\\;CREATE SCHEMA IF NOT EXISTS operaciones\\;CREATE SCHEMA IF NOT EXISTS personas\\;CREATE SCHEMA IF NOT EXISTS seguridad
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Optimizacion de Pool de Conexiones HikariCP para alto rendimiento
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.initialization-fail-timeout=0

# Consola web de H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Hibernate para H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Optimizacion de arranque en escritorio
spring.main.banner-mode=off

# Logs
logging.file.name=./logs/cobranza-dev.log
logging.level.com.condominio=INFO
